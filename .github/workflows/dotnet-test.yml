name: .NET Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Paradise.Rendering.Browser.Sample is a Microsoft.NET.Sdk.WebAssembly app
      # (UsingBrowserRuntimeWorkload=true), so the solution no longer builds on a stock SDK -
      # without this the build fails with NETSDK1147. Only the sample needs it; the packable
      # Paradise.Rendering.Browser library is an ordinary net10.0 class library.
      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools

      # Cache the downloaded slangc toolchain across runs. Keyed on the manifest SHA so a Slang
      # version bump invalidates the cache automatically; the cache root mirrors RestoreSlang's
      # default ($(NuGetPackageRoot)_slang) which lives under ~/.nuget/packages on Linux runners.
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/_slang
          key: slang-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/slang/slang.manifest.json') }}
          restore-keys: |
            slang-${{ runner.os }}-${{ runner.arch }}-

      # Same location and layout `paradise tools install ktx` uses, so KtxTool.Find finds it
      # and the texture encode tests run instead of skipping. Keyed on the manifest SHA like slangc.
      - name: Cache ktx
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/_ktx
          key: ktx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ktx/ktx.manifest.json') }}

      - name: Install ktx (KTX-Software)
        run: |
          version=$(jq -r .version tools/ktx/ktx.manifest.json)
          dotnet run --project tools/ktx/KtxBootstrap.csproj -- \
            --manifest tools/ktx/ktx.manifest.json --rid linux-x64 \
            --out ~/.nuget/packages/_ktx/$version/linux-x64

      - name: Prepare CI solution
        run: |
          cp ParadiseEngine.slnx ParadiseEngine.ci.slnx
          dotnet sln ParadiseEngine.ci.slnx remove \
            src/Paradise.ECS.Concurrent.Test/Paradise.ECS.Concurrent.Test.csproj \
            src/Paradise.ECS.CoyoteTest/Paradise.ECS.CoyoteTest.csproj

      - name: Restore dependencies
        run: dotnet restore ParadiseEngine.ci.slnx

      - name: Build
        run: dotnet build ParadiseEngine.ci.slnx --no-restore -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test --solution ParadiseEngine.ci.slnx --no-build --output normal
        env:
          # The encode tests must run here, not skip: a missing ktx is a CI fault.
          PARADISE_REQUIRE_KTX: "1"
          # NoesisGUI license for Paradise.Ui.Noesis[.Host] tests; without these the tests
          # still run (unlicensed Noesis renders for 10 minutes per session).
          NOESIS_LICENSE_NAME: ${{ secrets.NOESIS_LICENSE_NAME }}
          NOESIS_LICENSE_KEY: ${{ secrets.NOESIS_LICENSE_KEY }}
