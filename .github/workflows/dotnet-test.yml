name: .NET Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The publish workflow runs this first, so no package ships from an untested commit.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every standalone Coyote runner, rewritten in Release so interleavings are explored rather than
  # merely executed. docs/development/concurrency.md requires these for lock and queue changes.
  coyote:
    name: coyote (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Assets.Pipeline, project: src/Assets/Paradise.Assets.Pipeline.CoyoteTest }
          - { name: Assets.Project, project: src/Assets/Paradise.Assets.Project.CoyoteTest }
          - { name: Features, project: src/Foundation/Paradise.Features.CoyoteTest }
          - { name: Hosting, project: src/Platform/Paradise.Hosting.CoyoteTest }
          - { name: Rendering.WebGPU, project: src/Rendering/Paradise.Rendering.WebGPU.CoyoteTest }
          - { name: ECS, project: src/Simulation/Paradise.ECS.CoyoteTest }
          - { name: ECS.Jobs, project: src/Simulation/Paradise.ECS.Jobs.CoyoteTest }
          - { name: Cli, project: src/Tools/Paradise.Cli.CoyoteTest }
          - { name: Ui.ImGui, project: src/UI/Paradise.Ui.ImGui.CoyoteTest }
          - { name: Runtime, project: src/Runtime/Paradise.Runtime.CoyoteTest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Coyote
        run: dotnet tool install --global Microsoft.Coyote.CLI --version 1.7.11
      - name: Build and rewrite
        run: dotnet build ${{ matrix.project }} -c Release
      - name: Explore interleavings
        run: dotnet run --project ${{ matrix.project }} -c Release --no-build -- 200

  # The full suite with a software Vulkan driver (lavapipe), so the WebGPU, PBR and UI GPU tests run
  # instead of skipping. PARADISE_REQUIRE_GPU turns any "no adapter" skip into a failure.
  test:
    runs-on: ubuntu-24.04
    env:
      # PBR stays off lavapipe on this lane (see GPU_SKIP_PROJECTS below); tests that render PBR
      # outside Paradise.Rendering.Pbr.Test, such as the reference host, skip for the same reason.
      PARADISE_SKIP_PBR_GPU: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Dawn's Linux build links LLVM's C++ runtime (libc++, libc++abi, libunwind); without them the
      # library fails to load and every GPU test used to skip. Mesa provides the Vulkan device.
      - name: Install Dawn runtime dependencies and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc++1 libc++abi1 libvulkan1 mesa-vulkan-drivers vulkan-tools
          llvm=$(ls -d /usr/lib/llvm-* | sed 's|.*/llvm-||' | sort -n | tail -1)
          sudo apt-get install -y --no-install-recommends "libunwind-$llvm"
          echo "LD_LIBRARY_PATH=/usr/lib/llvm-$llvm/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          vulkaninfo --summary

      # Cache the downloaded slangc toolchain across runs. Keyed on the manifest SHA so a Slang
      # version bump invalidates the cache automatically; the cache root mirrors RestoreSlang's
      # default ($(NuGetPackageRoot)_slang) which lives under ~/.nuget/packages on Linux runners.
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/_slang
          key: slang-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/slang/slang.manifest.json') }}
          restore-keys: |
            slang-${{ runner.os }}-${{ runner.arch }}-

      # Same location and layout `paradise tools install ktx` uses, so KtxTool.Find finds it
      # and the texture encode tests run instead of skipping. Keyed on the manifest SHA like slangc.
      - name: Cache ktx
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/_ktx
          key: ktx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ktx/ktx.manifest.json') }}

      - name: Install ktx (KTX-Software)
        run: |
          version=$(jq -r .version tools/ktx/ktx.manifest.json)
          dotnet run --project tools/ktx/KtxBootstrap.csproj -- \
            --manifest tools/ktx/ktx.manifest.json --rid linux-x64 \
            --out ~/.nuget/packages/_ktx/$version/linux-x64

      - name: Verify standalone Slang bootstrap under CI and publish settings
        run: python3 tools/slang/test_ci_bootstrap.py

      - name: Verify incremental compilation of external shader includes
        run: python3 tools/slang/test_incremental_shaders.py

      - name: Restore dependencies
        run: dotnet restore ParadiseEngine.slnx

      - name: Build
        run: dotnet build ParadiseEngine.slnx --no-restore -p:TreatWarningsAsErrors=true

      - name: Check that Dawn loads
        run: |
          dawn=$(find src -path '*/bin/Debug/net10.0/runtimes/linux-x64/native/webgpu_dawn.so' | head -1)
          ldd "$dawn"
          if ldd "$dawn" | grep -q 'not found'; then
            echo "::error::webgpu_dawn.so has unresolved dependencies"
            exit 1
          fi

      - name: Test (CPU)
        run: bash .github/scripts/run-tests.sh cpu
        env:
          # The encode tests must run here, not skip: a missing ktx is a CI fault.
          PARADISE_REQUIRE_KTX: "1"

      - name: Test (GPU, lavapipe)
        if: ${{ !cancelled() }}
        run: bash .github/scripts/run-tests.sh gpu
        env:
          # A missing WebGPU device fails the GPU tests instead of skipping them.
          PARADISE_REQUIRE_GPU: "1"
          # lavapipe renders on the CPU: bound its threads and give one heavy frame time to land.
          LP_NUM_THREADS: "2"
          PARADISE_GPU_TIMEOUT_SECONDS: "60"
          # lavapipe keeps GPU memory in system RAM, and the PBR suite's atlases exhaust the hosted
          # runner (it is shut down mid-suite). The macOS lane runs that suite on Metal instead.
          GPU_SKIP_PROJECTS: Paradise.Rendering.Pbr.Test
          # NoesisGUI license for Paradise.Ui.Noesis tests; without these the tests
          # still run (unlicensed Noesis renders for 10 minutes per session).
          NOESIS_LICENSE_NAME: ${{ secrets.NOESIS_LICENSE_NAME }}
          NOESIS_LICENSE_KEY: ${{ secrets.NOESIS_LICENSE_KEY }}

      - name: Enforce skip budget
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-skip-budget.sh 40

      - name: Publish and run managed ECS NativeAOT regressions
        run: |
          dotnet publish tools/ecs-managed-aot/ManagedAotSmoke.csproj -c Release -o artifacts/managed-aot
          artifacts/managed-aot/ManagedAotSmoke
          dotnet publish tools/ecs-managed-aot/ManagedAotSmoke.csproj -c Release -p:ManagedSmokeTags=false -o artifacts/managed-plain-aot
          artifacts/managed-plain-aot/ManagedAotSmoke

  # The Win32 and Cocoa paths (surfaces, watch trays, path handling) only run on their platforms.
  # Both lanes build everything and run the CPU suite. macOS runners expose Metal, so that lane
  # also runs the GPU suite on real hardware; Windows only has WARP, which is too slow to be useful
  # next to lavapipe and Metal.
  platforms:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, gpu: false }
          - { os: macos-latest, gpu: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/_slang
          key: slang-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/slang/slang.manifest.json') }}
          restore-keys: |
            slang-${{ runner.os }}-${{ runner.arch }}-
      - name: Build
        run: dotnet build ParadiseEngine.slnx -p:TreatWarningsAsErrors=true
      - name: Test (CPU)
        run: bash .github/scripts/run-tests.sh cpu
      - name: Test (GPU, Metal)
        if: ${{ matrix.gpu && !cancelled() }}
        run: bash .github/scripts/run-tests.sh gpu
        env:
          PARADISE_REQUIRE_GPU: "1"
          NOESIS_LICENSE_NAME: ${{ secrets.NOESIS_LICENSE_NAME }}
          NOESIS_LICENSE_KEY: ${{ secrets.NOESIS_LICENSE_KEY }}
