name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, for example v1.2.3 or 1.2.3-beta.1"
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  CONFIGURATION: Release
  PACKAGE_OUTPUT_DIR: artifacts/nuget
  NUGET_SOURCE_URL: https://api.nuget.org/v3/index.json

jobs:
  # The full test workflow (all Coyote runners, the GPU lane, Windows and macOS) must pass first.
  test:
    uses: ./.github/workflows/dotnet-test.yml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Paradise.Rendering.Pbr embeds Slang-compiled shaders; cache the slangc toolchain
      # exactly like dotnet-test.yml does (keyed on the manifest so version bumps invalidate).
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/_slang
          key: slang-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/slang/slang.manifest.json') }}
          restore-keys: |
            slang-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve package version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Resolve NuGet user
        id: nuget-user
        shell: bash
        run: |
          user="${{ vars.NUGET_USER || github.repository_owner }}"

          if [[ -z "$user" ]]; then
            echo "::error::Set the NUGET_USER repository variable to your nuget.org username."
            exit 1
          fi

          echo "value=$user" >> "$GITHUB_OUTPUT"

      # Every project MSBuild reports as packable, so a new library cannot be forgotten. Tests,
      # benchmarks, samples and generators opt out with IsPackable=false. Source generators ship
      # inside Paradise.BT, Paradise.ECS and Paradise.Authoring (analyzers/dotnet/cs); Paradise.Cli
      # packs as a dotnet tool (PackAsTool) and pushes on the same run.
      - name: Pack all packages
        shell: bash
        run: |
          projects=()
          ids=()
          while IFS= read -r project; do
            properties=$(dotnet msbuild "$project" -getProperty:IsPackable -getProperty:PackageId)
            if [[ $(jq -r .Properties.IsPackable <<< "$properties") == "true" ]]; then
              projects+=("$project")
              ids+=("$(jq -r .Properties.PackageId <<< "$properties")")
            fi
          done < <(git ls-files 'src/*.csproj' | sort)
          echo "Packing ${#projects[@]} projects: ${ids[*]}"

          # A package nobody can find is a package nobody uses: each one needs a README row.
          missing=0
          for id in "${ids[@]}"; do
            if ! grep -qF "[$id](" README.md; then
              echo "::error::$id is packable but has no row in README.md"
              missing=1
            fi
          done
          [[ $missing -eq 0 ]] || exit 1

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              -c "$CONFIGURATION" \
              -o "$PACKAGE_OUTPUT_DIR" \
              -p:ContinuousIntegrationBuild=true \
              -p:Version="$PACKAGE_VERSION"
          done

          count=$(ls "$PACKAGE_OUTPUT_DIR"/*.nupkg | wc -l)
          if [[ "$count" -ne "${#projects[@]}" ]]; then
            echo "::error::Expected ${#projects[@]} packages, found $count"
            exit 1
          fi

          # The generators must travel inside their runtime packages, or consumers silently get no codegen.
          for pair in Paradise.ECS:Paradise.ECS.Generators Paradise.BT:Paradise.BT.Generators Paradise.Authoring:Paradise.Authoring.Generators; do
            package="$PACKAGE_OUTPUT_DIR/${pair%%:*}.$PACKAGE_VERSION.nupkg"
            if ! unzip -l "$package" | grep -q "analyzers/dotnet/cs/${pair##*:}.dll"; then
              echo "::error::${pair%%:*} does not ship ${pair##*:}"
              exit 1
            fi
          done

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ steps.nuget-user.outputs.value }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "${{ env.NUGET_SOURCE_URL }}"
          --skip-duplicate
