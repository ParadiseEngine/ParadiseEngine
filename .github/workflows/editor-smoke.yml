# The editor host, booted for real on every change: a window-less run that renders the dockspace
# and reads the frame back. Separate from .NET Test because it needs a GPU, and the only GPU a
# hosted runner has is a software one — keeping it apart means a lavapipe problem reads as a
# lavapipe problem rather than reddening the whole test job.
#
# Linux only. macOS runners have no GPU at all and Windows runners have no software Vulkan, so
# this is the one platform where the check can actually run.
name: Editor Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headless-boot:
    runs-on: ubuntu-latest

    env:
      # lavapipe, Mesa's software Vulkan. Both names are set because the loader renamed the
      # variable: VK_ICD_FILENAMES is the old one and still honoured, VK_DRIVER_FILES the new.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools

      # Reported before the editor runs, so "no adapter" is distinguishable from "the editor
      # crashed" — they fail at the same place otherwise.
      - name: Report the adapter
        run: vulkaninfo --summary || true

      # Paradise.Rendering imports Slang.targets, so the host's graph downloads slangc on first
      # build. Same cache key as .NET Test uses.
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/_slang
          key: slang-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/slang/slang.manifest.json') }}
          restore-keys: |
            slang-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the editor host
        run: dotnet build src/Paradise.Editor.Host/Paradise.Editor.Host.csproj -c Release -p:TreatWarningsAsErrors=true

      # The host asserts the frame produced draw commands and the dockspace node was built, so a
      # non-zero exit is a real failure rather than something this step has to re-check.
      - name: Boot headless and capture a frame
        run: |
          dotnet run --project src/Paradise.Editor.Host/Paradise.Editor.Host.csproj -c Release --no-build -- \
            --frames 8 --screenshot editor.png

      - name: Check the screenshot is not empty
        run: test -s editor.png

      # Uploaded because when this goes wrong the picture is the diagnosis: a clear-coloured frame
      # says the overlay never composited, a blank one says the capture path did not.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-headless-frame
          path: editor.png
          if-no-files-found: warn
