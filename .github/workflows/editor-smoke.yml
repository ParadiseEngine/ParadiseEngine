# The editor host, booted for real on every change: a window-less run that renders the dockspace
# and reads the frame back, JIT and then published ahead-of-time. Separate from .NET Test because
# it needs a GPU, and the only GPU a hosted runner has is a software one — keeping it apart means
# a lavapipe problem reads as a lavapipe problem rather than reddening the whole test job.
#
# Both runs share one job rather than getting one each: they need the same apt packages, the same
# discovered ICD and the same slangc cache, and paying for that twice buys nothing. The step names
# are what keep a failure unambiguous.
#
# Linux only. macOS runners have no GPU at all and Windows runners have no software Vulkan, so
# this is the one platform where the check can actually run.
name: Editor Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headless-boot:
    runs-on: ubuntu-latest
    # The capture waits inside the renderer are bounded, but adapter acquisition on a software
    # driver is not, and the default is six hours. Generous enough for an AOT publish, which is
    # minutes of native compilation on its own.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # libc++ is not optional and is not about Vulkan: Dawn's Linux build links LLVM's C++
      # runtime rather than libstdc++, so without it the native library fails to load and the
      # renderer never gets as far as asking for an adapter. It is also why the main test job has
      # always been green here — its GPU tests take their "native library not loadable" skip.
      - name: Install lavapipe and Dawn's runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 vulkan-tools libc++1 libc++abi1

      # The ICD path is DISCOVERED, not assumed. Setting VK_ICD_FILENAMES replaces the loader's
      # own search rather than adding to it, so naming a file that is not there is worse than
      # naming nothing — it turns "a driver the loader would have found" into "found no drivers".
      # Reported before the editor runs, so a missing adapter is distinguishable from a crash.
      - name: Find the software Vulkan driver
        run: |
          ls -la /usr/share/vulkan/icd.d/ || true
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          if [ -n "$icd" ]; then
            echo "using $icd"
            echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
            echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
            export VK_ICD_FILENAMES="$icd" VK_DRIVER_FILES="$icd"
          else
            echo "no lavapipe ICD found; leaving the loader to its own search"
          fi
          vulkaninfo --summary 2>&1 | head -30 || true

      # Paradise.Rendering imports Slang.targets, so the host's graph downloads slangc on first
      # build. Same cache key as .NET Test uses.
      - name: Cache slangc
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages/_slang
          key: slang-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/slang/slang.manifest.json') }}
          restore-keys: |
            slang-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the editor host
        run: dotnet build src/Paradise.Editor.Host/Paradise.Editor.Host.csproj -c Release -p:TreatWarningsAsErrors=true

      # The host asserts the frame produced draw commands and the dockspace node was built, so a
      # non-zero exit is a real failure rather than something this step has to re-check.
      - name: Boot headless and capture a frame
        run: |
          dotnet run --project src/Paradise.Editor.Host/Paradise.Editor.Host.csproj -c Release --no-build -- \
            --frames 8 --screenshot editor.png

      - name: Check the screenshot is not empty
        run: test -s editor.png

      # PublishAot lives in Paradise.Editor.Host.csproj, NOT on this command line: passing it here
      # propagates to every project in the graph, and the netstandard2.0 source generators fail
      # with NETSDK1207. The three editor/UI libraries carry IsAotCompatible, so the trim and AOT
      # analyzers have already run by the time this step does — what it adds is proof that the
      # published binary actually starts, which no analyzer can tell you.
      - name: Publish the editor host ahead-of-time
        run: |
          dotnet publish src/Paradise.Editor.Host/Paradise.Editor.Host.csproj \
            -c Release -r linux-x64 -p:TreatWarningsAsErrors=true

      - name: Boot the AOT binary and capture a frame
        run: |
          src/Paradise.Editor.Host/bin/Release/net10.0/linux-x64/publish/Paradise.Editor.Host \
            --frames 8 --screenshot editor-aot.png

      # Identical bytes, not merely both non-empty. A trimmed build that quietly lost the embedded
      # fonts still renders, still exits zero and still writes a valid PNG — it just draws in
      # ImGui's fallback face, which only a comparison catches.
      - name: The AOT frame must match the JIT frame
        run: |
          if ! cmp -s editor.png editor-aot.png; then
            echo "AOT and JIT frames differ; both are uploaded as artifacts."
            exit 1
          fi

      # Uploaded because when this goes wrong the picture is the diagnosis: a clear-coloured frame
      # says the overlay never composited, a blank one says the capture path did not.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-headless-frame
          path: |
            editor.png
            editor-aot.png
          if-no-files-found: warn
